# PC4 · Grupo 3 — despliegue local con Docker Compose (6 contenedores).
name: pc4-grupo3

x-dataset: &dataset
  type: bind
  source: "./data/DATASET_Denuncias Policiales - Enero 2018 a Septiembre 2026.csv"
  target: /data/dataset.csv
  read_only: true

x-node: &node
  build: .
  command: ["/app/node"]
  restart: unless-stopped
  volumes: [*dataset]
  depends_on:
    coordinator:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  coordinator:
    build: .
    command: ["/app/coordinator"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      TCP_ADDR: ":9090"
      DATA_PATH: /data/dataset.csv
      MONGO_URI: "mongodb://mongo:27017/?serverSelectionTimeoutMS=3000"
      MONGO_DB: pc4_denuncias
      REDIS_ADDR: "redis:6379"
      CACHE_TTL: 10m
      METRICS_INTERVAL: 30s
      EXPECTED_NODES: "3"
    ports: ["8080:8080"]          # API REST + Swagger (el puerto TCP 9090 queda solo en la red interna)
    volumes: [*dataset]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  ml-node-1:
    <<: *node
    environment: { NODE_ID: ml-node-1, COORDINATOR_ADDR: "coordinator:9090", DATA_PATH: /data/dataset.csv }

  ml-node-2:
    <<: *node
    environment: { NODE_ID: ml-node-2, COORDINATOR_ADDR: "coordinator:9090", DATA_PATH: /data/dataset.csv }

  ml-node-3:
    <<: *node
    environment: { NODE_ID: ml-node-3, COORDINATOR_ADDR: "coordinator:9090", DATA_PATH: /data/dataset.csv }

volumes:
  mongo-data:
